<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dongsoop Google Login Test</title>

    <!-- Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }

        #result {
            margin-top: 20px;
            padding: 15px;
            background: #f5f5f5;
            white-space: pre-wrap;
            border-radius: 10px;
        }
    </style>
</head>
<body>

<h2>Google Login Test</h2>

<div id="g_id_onload"
     data-client_id="955124056033-fusrd3fef5eajdqkcf4oglo5tfjnb74l.apps.googleusercontent.com"
     data-callback="handleCredentialResponse">
</div>

<div class="g_id_signin"
     data-type="standard"
     data-size="large">
</div>

<div id="result">로그인을 진행해주세요.</div>

<script>

const API_BASE_URL = "http://localhost:3000";
// Render 테스트 시
// const API_BASE_URL = "https://dongsoop.onrender.com";

async function handleCredentialResponse(response) {

    console.log("Google idToken");
    console.log(response.credential);

    document.getElementById("result").innerText =
        "Google 로그인 성공!\n\n백엔드로 요청 중...";

    try {

        const res = await fetch(
            `${API_BASE_URL}/api/auth/google`,
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    idToken: response.credential
                })
            }
        );

        const data = await res.json();

        console.log(data);

        if (data.success) {

            localStorage.setItem("jwt", data.token);

            document.getElementById("result").innerText =
                JSON.stringify(data, null, 4);

        } else {

            document.getElementById("result").innerText =
                JSON.stringify(data, null, 4);

        }

    } catch(err){

        console.error(err);

        document.getElementById("result").innerText =
            err.message;
    }

}

</script>

</body>
</html>
